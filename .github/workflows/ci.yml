name: CI

# One run per pull request (on the merge result with the base branch, forks included), one per push
# to main, and manual runs. Branch pushes without a PR do not run: a second, skipped "test" check
# on the PR used to count as passed for branch protection.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required status check for merging into main (branch protection: "test").
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # @rullino/node's tests run Dawn (the webgpu package): without a GPU it needs a software
      # Vulkan driver, Mesa's lavapipe.
      - run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      # Unit tests first: the fastest feedback. Step timeouts (~10x the usual run) make a stuck
      # Dawn / lavapipe process fail in minutes instead of using up the job (#100).
      - run: pnpm test
        timeout-minutes: 5
      # No GPU on hosted runners: Chromium runs WebGPU on SwiftShader.
      - run: pnpm exec playwright install --with-deps chromium
      # Fail fast, with a clear message, if Chromium cannot get a WebGPU adapter.
      - name: WebGPU adapter available
        run: pnpm exec vitest run --project browser packages/core/src/gpu/adapter.browser.test.ts
      # Unit + GPU tests with coverage; fails below the thresholds in vitest.config.ts.
      - run: pnpm test:coverage
        timeout-minutes: 12
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      # Builds the packages (dist/) and the playground.
      - run: pnpm build
      # The TypeDoc API reference: warnings (broken {@link}, exported types that point at unexported ones) fail it.
      - run: pnpm build:docs
      # gzip size of every package and of the playground's main chunk against size-budget.json.
      - run: pnpm size
      # The packed packages as a user installs them: tarball contents, Node ESM, and a Vite bundle
      # running a GPU filter in Chromium (compared with the CPU one).
      - run: pnpm test:pack
      # Built playground in headless Chromium: WebGPU renderer, every filter, pixels actually change.
      - run: pnpm test:e2e
      # The same build served from a sub-path, as on GitHub Pages: no root-absolute URLs, no 404s.
      - run: pnpm test:e2e:base
      # Timings are not asserted (shared runners vary); this only checks that the benchmark runs.
      - run: pnpm bench
      # The CPU benchmark is bundled before it runs: check the bundle builds and runs (one filter).
      - run: pnpm bench:cpu filters --only gaussianBlur
      # The comparison page (#77) on a small image: every library still loads and runs (SwiftShader
      # timings mean nothing; real numbers come from real machines).
      - run: pnpm bench:web --headless --strict --sizes 320x240 --runs 1

  # The ML models themselves (SlimSAM, MI-GAN, Depth Anything on ONNX Runtime's WASM backend) and the
  # playground's Object, Remove object and Lens blur tools. A separate job: it downloads 69 MB from Hugging Face (cached by
  # the pinned revisions) and takes a few minutes of CPU inference.
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .cache/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: pnpm test:ml
      # The playground's Object, Remove object and Lens blur tools end to end, models served locally (no network in the test).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e:ml
