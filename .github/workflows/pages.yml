name: Pages

# Publishes the playground (apps/playground/dist) on GitHub Pages after every push to main, and on
# demand. Needs Settings > Pages > Source = "GitHub Actions" in the repository. The build uses
# relative URLs (Vite base './'), so it works at https://<user>.github.io/rullino/ and under a
# custom domain, with or without a sub-path (CI's smoke-base test serves it from one).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in deploy-pages' README: with the upload and the deploy in one job, the deploy's
# artifact lookup sometimes found nothing right after a successful upload ("Found 0 artifact(s)",
# three runs in a row on 24 Nov 2026; actions/deploy-pages#451). A separate job reads the artifact
# once its upload has finished, and the deploy can be re-run alone.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The playground reads the packages' sources, so only the site needs building.
      - run: pnpm --filter @rullino/playground build
      # The API reference goes next to the playground (dist/docs); it must come after the Vite build, which empties dist/.
      - run: pnpm build:docs
      # The hardware check page (…/check/): built on its own and copied in after the Vite build above, which empties dist/.
      - run: pnpm --filter @rullino/hardware-check build
      - run: cp -r apps/hardware-check/dist apps/playground/dist/check
      # rullino tools (…/tools/): one page per job, built on its own and copied in the same way.
      - run: pnpm --filter @rullino/tools build
      - run: cp -r apps/tools/dist apps/playground/dist/tools
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
