<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rullino: WebGPU, or the CPU in a worker</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
      canvas { border: 1px solid #ccc; max-width: 100%; height: auto; }
      form { display: grid; gap: 10px; min-width: 220px; align-content: start; }
      label { display: grid; gap: 2px; }
      output { display: block; min-height: 3em; }
    </style>
  </head>
  <body>
    <canvas width="640" height="480"></canvas>
    <form id="controls">
      <label>Backend
        <select name="backend">
          <option value="auto">auto (WebGPU, else the CPU)</option>
          <option value="gpu">gpu (fails without WebGPU)</option>
          <option value="cpu">cpu (a Web Worker)</option>
        </select>
      </label>
      <label>Exposure <input name="ev" type="range" min="-2" max="2" step="0.05" value="0" /></label>
      <label>Blur <input name="blur" type="range" min="0" max="20" step="0.5" value="0" /></label>
      <output id="status"></output>
      <output id="stall"></output>
    </form>
    <script type="module" src="./main.js"></script>
  </body>
</html>
