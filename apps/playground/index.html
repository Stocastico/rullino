<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rullino playground</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; background: #1b1b1d; color: #eee; }

      label { display: inline-flex; gap: 8px; align-items: center; margin-right: 16px; }
      #status { opacity: 0.7; font-size: 0.9em; }

    <canvas id="out"></canvas>
