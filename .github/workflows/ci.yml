name: CI

# Every push gets a run (branch pushes cover same-repo PRs); forks are covered by pull_request.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip the duplicate pull_request run for branches in this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # No GPU on hosted runners: Chromium runs WebGPU on SwiftShader.
      - run: pnpm exec playwright install --with-deps chromium
      # Fail fast, with a clear message, if Chromium cannot get a WebGPU adapter.
      - name: WebGPU adapter available
        run: pnpm exec vitest run --project browser packages/core/src/gpu/adapter.browser.test.ts
      - run: pnpm test:browser
      - run: pnpm build
