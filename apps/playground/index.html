<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rullino playground</title>
    <meta name="description" content="Edit photos with WebGPU filters in your browser: chains of adjustments, masks, looks and optional AI tools. Your images never leave your machine." />
    <meta name="theme-color" content="#161618" />
    <meta property="og:title" content="rullino playground" />
    <meta property="og:description" content="GPU-first image processing for the web: filter chains, masks, looks, object removal, lens blur." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161618'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f0a23b' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>rullino <span id="version" title="Version of the packages this playground runs">%RULLINO_VERSION%</span></h1>
      <div class="actions">
        <button id="undo" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
        <button id="redo" type="button" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
        <button id="share" type="button" title="Copy a link to these edits">Copy link</button>
        <button id="code" type="button" title="These edits as an edit document and as code for the browser, Konva or Node">Code</button>
      </div>
      <nav aria-label="Project">
        <code id="install" title="Install the library (click to select)">%RULLINO_INSTALL%</code>
        <a href="https://github.com/Stocastico/rullino" target="_blank" rel="noopener" title="Source code, issues and README">GitHub</a>
        <a href="https://github.com/Stocastico/rullino/blob/main/docs/filters.md" target="_blank" rel="noopener" title="Every filter with its parameters, ranges and defaults">Filters</a>
        <a href="https://github.com/Stocastico/rullino/blob/main/docs/parity.md" target="_blank" rel="noopener" title="How far GPU and CPU output may differ, per filter">Parity</a>
        <a id="docs-link" href="./docs/" target="_blank" rel="noopener" title="API reference of the packages">API docs</a>
      </nav>
      <p id="status">Starting…</p>
      <p id="announce" class="visually-hidden" aria-live="polite"></p>
    </header>
    <main>
      <aside>
        <section>
          <h2>Effects</h2>
          <button id="browse" type="button" title="Search every effect, with a preview on your photo (Ctrl+K)">Browse effects… <kbd>Ctrl K</kbd></button>
          <button id="auto" type="button" title="Suggest white balance and levels for this image">Auto</button>
          <div id="chain"></div>
        </section>
        <section>
          <h2>Image</h2>
          <label>Sample <select id="sample"></select></label>
          <label class="file">Open file… <input id="file" type="file" accept="image/*" /></label>
          <p class="hint">or drop an image anywhere</p>
        </section>
        <section>
          <h2>Geometry</h2>
          <div id="geometry" class="geometry"></div>
        </section>
        <section>
          <h2>Histogram of the result</h2>
          <canvas id="histogram" class="histogram" aria-label="Histogram of the result"></canvas>
        </section>
        <section>
          <h2>Looks</h2>
          <div id="looks" class="looks" role="list"></div>
        </section>
        <section>
          <h2>Export</h2>
          <label>Format
            <select id="export-format">
              <option value="png">PNG (8-bit)</option>
              <option value="png16">PNG (16-bit)</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
          </label>
          <label>Quality <input id="export-quality" type="range" min="0.5" max="1" step="0.01" value="0.92" /></label>
          <label>Long side <input id="export-size" type="number" min="16" step="1" placeholder="original" /> px</label>
          <button id="export" type="button">Export full resolution</button>
          <p class="hint">JPEG is flattened onto white.</p>
        </section>
        <section>
          <h2>Compare</h2>
          <label><input id="compare" type="checkbox" checked /> Before / after</label>
          <label>Split <input id="split" type="range" min="0" max="1" step="0.001" value="0.5" /></label>
        </section>
      </aside>
      <div id="workspace">
      <figure id="viewport">
        <div class="zoom-bar" role="group" aria-label="Zoom">
          <button id="zoom-out" type="button" title="Zoom out (−)" aria-label="Zoom out">−</button>
          <button id="zoom-fit" type="button" title="Fit (0)">Fit</button>
          <button id="zoom-in" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
        </div>
        <div id="stage">
          <canvas id="after" aria-label="Filtered image"></canvas>
          <canvas id="before" aria-label="Original image"></canvas>
          <div id="handle" aria-hidden="true"><span>before</span><span>after</span></div>
          <svg id="overlay" preserveAspectRatio="none" aria-label="Mask handles"></svg>
          <svg id="geometry-overlay" preserveAspectRatio="none" aria-label="Crop handles"></svg>
        </div>
      </figure>
      <div id="strip" aria-label="Chain"></div>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
