name: Dawn spike

# Spike #72, not to be merged: does rullino run on WebGPU in Node (Dawn, `webgpu` package) on a
# hosted runner without a GPU? Mesa's lavapipe provides a software Vulkan driver.
on:
  pull_request:
    paths: ['scripts/spike/**', '.github/workflows/dawn-spike.yml']

jobs:
  dawn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Install webgpu and the published packages
        run: |
          mkdir spike && cp scripts/spike/*.mjs spike/ && cd spike
          npm init -y >/dev/null && npm pkg set type=module
          npm install webgpu @rullino/core@0.1.0 @rullino/filters@0.1.0
          du -sh node_modules/webgpu
      - name: Parity (lavapipe)
        working-directory: spike
        run: VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json node dawn-parity.mjs
      - name: 12 MP chains (lavapipe; CPU reference too)
        working-directory: spike
        run: nproc && VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json node dawn-bench.mjs --cpu
