name: Short links

# Deploys the short-link Worker (apps/short-links, #208) to Cloudflare. By hand only (Actions > Short
# links > Run workflow): it changes a live service. Needs the repository secret CLOUDFLARE_API_TOKEN
# (an API token from the "Edit Cloudflare Workers" template); wrangler finds the account from it.
# The Worker has no dependencies: wrangler bundles src/worker.ts itself, so nothing is installed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # A release at least two weeks old, pinned; bump it deliberately.
      - name: Deploy
        working-directory: apps/short-links
        run: npx --yes wrangler@4.158.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
